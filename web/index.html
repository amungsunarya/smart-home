<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f3460">
  <title>Smart Home</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
</head>
<body>
  <header>
    <h1>🏠 Smart Home</h1>
    <span id="conn-status" class="badge">...</span>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="lampu">💡 Lampu</button>
    <button class="tab" data-tab="flash">⚡ Flash ESP32</button>
  </nav>

  <section id="tab-lampu" class="tab-panel">
    <div class="grid" id="grid-lampu"></div>
  </section>

  <section id="tab-flash" class="tab-panel" hidden>
    <div class="card">
      <label>File Firmware (.bin)</label>
      <input type="file" id="firmware" accept=".bin">
      <label>Offset (hex)</label>
      <input type="text" id="offset" value="0x10000">
      <button id="btn-flash">Mulai Flash</button>
      <pre id="flash-log">Belum ada proses.</pre>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
