version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"                      # MQTT untuk ESP32 (plain)
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/data:/mosquitto/data
    networks: [smart-net]

  flasher:
    build: ./flasher
    container_name: esp32-flasher
    restart: unless-stopped
    devices:
      - "/dev/ttyUSB0:/dev/ttyUSB0"      # ⚠️ sesuaikan port serial
    group_add:
      - dialout
    volumes:
      - ./firmware:/firmware
    networks: [smart-net]

  web:
    image: nginx:alpine
    container_name: smart-home-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on: [mosquitto, flasher]
    networks: [smart-net]

networks:
  smart-net:
    driver: bridge